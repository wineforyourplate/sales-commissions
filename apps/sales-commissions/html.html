<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Sales commissions</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='32' height='32' rx='8' fill='%230B7A4B'/%3E%3Ccircle cx='11' cy='11' r='3.4' fill='none' stroke='%23fff' stroke-width='2.6'/%3E%3Ccircle cx='21' cy='21' r='3.4' fill='none' stroke='%23fff' stroke-width='2.6'/%3E%3Cpath d='M22.5 8.5l-13 15' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<!--
  Sales commissions: one app for the whole team. Built from app-src/ by app-src/build.py; edit those files, not this one.
  Everyone in the Lemma space opens the same app. Their Lemma role decides what they see:
    Admins and Editors = Managers, the FINANCE role = Finance, everyone else = Sales.
  Words people see are plain strings in app-src/app.js; colours are at the top of app-src/styles.css.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Sales commissions: the look ──────────────────────────────────────────────
   White page, cool greys, one colour per deal state. Change the colours here. */
:root {
  --bg: #FFFFFF;
  --soft: #F5F6F8;
  --soft-2: #EEF0F3;
  --line: #E3E5EA;
  --ink: #101216;
  --ink-2: #3B414B;
  --muted: #646B77;
  --waiting: #1F4FD8;  --waiting-bg: #EDF2FE;
  --earned: #0B7A4B;   --earned-bg: #E7F5EE;
  --look: #8F5200;     --look-bg: #FFF3DB;
  --rejected: #B3261E; --rejected-bg: #FCEBEA;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 18, 22, .06), 0 4px 16px rgba(16, 18, 22, .06);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.5 var(--font); font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; }
.num, .money, td.r, .stat b { font-variant-numeric: tabular-nums; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--waiting); outline-offset: 2px; border-radius: 6px; }
h1 { font-size: 24px; line-height: 1.25; letter-spacing: -.015em; margin: 0; font-weight: 650; }
h2 { font-size: 15px; margin: 0; font-weight: 600; }
.sub { color: var(--muted); margin: 4px 0 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── shell: sidebar on desktop, top bar + bottom tabs on phones ─────────── */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
.brand b { display: block; font-size: 14px; line-height: 1.2; }
.brand small { color: var(--muted); font-size: 12px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink-2); font-weight: 500; }
.nav a:hover { background: var(--soft); }
.nav a.on { background: var(--soft-2); color: var(--ink); }
.nav a .count { margin-left: auto; font-size: 12px; background: var(--ink); color: #fff; border-radius: 10px; padding: 0 7px; line-height: 18px; }
.nav svg { flex: none; color: var(--muted); }
.nav a.on svg { color: var(--ink); }
.side-foot { margin-top: auto; padding: 10px 8px 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; font-size: 13px; }
.side-foot .who { min-width: 0; }
.side-foot .who b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-foot .who small { color: var(--muted); }
.main { min-width: 0; }
.page { max-width: 1040px; margin: 0 auto; padding: 28px 32px 64px; }
.topbar, .tabs { display: none; }

@media (max-width: 760px) {
  .shell { display: block; }
  .side { display: none; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 20; }
  .topbar b { font-size: 15px; }
  .topbar .grow { flex: 1; }
  .page { padding: 18px 16px 104px; }
  .tabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); z-index: 20; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; font-size: 11px; color: var(--muted); padding: 6px 0; min-height: 48px; justify-content: center; position: relative; }
  .tabs a.on { color: var(--ink); font-weight: 600; }
  .tabs a .count { position: absolute; top: 2px; left: 55%; font-size: 10px; background: var(--ink); color: #fff; border-radius: 9px; padding: 0 5px; line-height: 16px; }
  h1 { font-size: 21px; }
}

/* ── bits ────────────────────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 14px; min-height: 40px; font-weight: 550; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--soft); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.dark:hover { background: #2A2E35; }
.btn.danger { color: var(--rejected); }
.btn.ghost { border-color: transparent; background: none; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--waiting); cursor: pointer; font-weight: 550; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.section { display: flex; align-items: baseline; gap: 8px; margin: 28px 0 10px; font-weight: 600; }
.section span { color: var(--muted); font-weight: 500; font-size: 13px; }
.av { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 11.5px; font-weight: 650; flex: none; }
.av.lg { width: 40px; height: 40px; font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 550; padding: 2px 9px; border-radius: 6px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.waiting { color: var(--waiting); background: var(--waiting-bg); }
.chip.approved, .chip.earned { color: var(--earned); background: var(--earned-bg); }
.chip.look { color: var(--look); background: var(--look-bg); }
.chip.rejected { color: var(--rejected); background: var(--rejected-bg); }
.chip.paid { color: var(--ink-2); background: var(--soft-2); }
.chip.checking { color: var(--muted); background: var(--soft); }
.chip.checking::before { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }
.card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 28px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); margin-bottom: 4px; }
.note { font-size: 13px; padding: 8px 10px; border-radius: 8px; }
.note.look { background: var(--look-bg); color: #5C3500; }
.note.ok { background: var(--soft); color: var(--ink-2); }
.note.rejected { background: var(--rejected-bg); color: #7A1A14; }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }

/* the commission line: rate × money = commission */
.cline { display: inline-flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.cline .op { color: var(--muted); }
.cline .res { font-weight: 650; color: var(--earned); }
.cline .rule { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }

/* statement strip */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stat { padding: 16px 18px; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; }
.stat label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.stat label i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.stat b { display: block; font-size: 24px; font-weight: 650; letter-spacing: -.01em; margin-top: 4px; }
.stat small { color: var(--muted); font-size: 12.5px; }
@media (max-width: 760px) {
  .stats { grid-template-columns: 1fr; }
  .stat { border-left: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; align-items: baseline; padding: 12px 14px; }
  .stat:first-child { border-top: 0; }
  .stat b { font-size: 19px; margin: 0; text-align: right; }
  .stat small { grid-column: 1 / -1; }
}

/* tables that turn into cards on phones */
.grid { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
table.t { width: 100%; border-collapse: collapse; }
.t th { text-align: left; font-size: 12px; font-weight: 550; color: var(--muted); padding: 9px 14px; background: var(--soft); border-bottom: 1px solid var(--line); }
.t td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t .r { text-align: right; }
.t tfoot td { background: var(--soft); font-weight: 600; }
.t tbody tr.link { cursor: pointer; }
.t tbody tr.link:hover td { background: #FAFBFC; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field label { font-weight: 550; font-size: 13.5px; }
.field .hint { font-size: 12.5px; color: var(--muted); }
.field .err { font-size: 12.5px; color: var(--rejected); }
.input { border: 1px solid #CDD1D8; border-radius: 8px; padding: 9px 11px; min-height: 42px; background: var(--bg); width: 100%; }
.input:focus { outline: 2px solid var(--waiting); outline-offset: -1px; border-color: transparent; }
textarea.input { min-height: 76px; resize: vertical; }
.seg { display: flex; border: 1px solid #CDD1D8; border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--bg); padding: 9px 8px; min-height: 42px; cursor: pointer; font-weight: 500; border-left: 1px solid #CDD1D8; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width: 560px) { .two { grid-template-columns: 1fr; } }

/* toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); z-index: 60; max-width: calc(100vw - 32px); font-weight: 500; }
@media (max-width: 760px) { .toast { bottom: 84px; } }

/* sheet (confirmations, forms on phones) */
.scrim { position: fixed; inset: 0; background: rgba(16, 18, 22, .38); z-index: 70; display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--bg); border-radius: 14px; width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px; box-shadow: var(--shadow); }
.sheet h2 { font-size: 17px; margin-bottom: 6px; }
.sheet .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
@media (max-width: 760px) { .scrim { align-items: end; padding: 0; } .sheet { border-radius: 16px 16px 0 0; width: 100%; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); } }

/* guided tour */
.tour-hole { position: fixed; z-index: 80; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(16, 18, 22, .45); pointer-events: none; transition: all .2s ease; }
.tour-card { position: fixed; z-index: 81; width: 320px; background: var(--bg); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
.tour-card .step { font-size: 12px; color: var(--muted); font-weight: 550; }
.tour-card h3 { margin: 4px 0 6px; font-size: 15.5px; }
.tour-card p { margin: 0; color: var(--ink-2); }
.tour-card .actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
@media (max-width: 760px) { .tour-card { left: 12px !important; right: 12px; width: auto; bottom: calc(76px + env(safe-area-inset-bottom)) !important; top: auto !important; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.center { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 24px; }
.skel { background: linear-gradient(90deg, var(--soft) 0, var(--soft-2) 50%, var(--soft) 100%); background-size: 200% 100%; animation: sh 1.2s linear infinite; border-radius: 8px; }
@keyframes sh { to { background-position: -200% 0; } }

/* ── Sales screens ── */
.dl { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) 130px 150px 150px; align-items: center; gap: 4px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); text-decoration: none; }
.drow:last-child { border-bottom: 0; }
.drow:hover { background: #FAFBFC; }
.drow .d-main b { display: block; font-weight: 600; }
.drow .d-main small { color: var(--muted); }
.drow .d-amt, .drow .d-com { text-align: right; font-variant-numeric: tabular-nums; }
.drow .d-com { font-weight: 600; }
.drow .d-com.soft { color: var(--muted); font-weight: 500; }
.drow .d-st { text-align: right; }
.drow .d-note { grid-column: 1 / -1; }
.dl-head { display: grid; grid-template-columns: minmax(0, 1fr) 130px 150px 150px; gap: 16px; padding: 9px 16px; background: var(--soft); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); font-weight: 550; }
.dl-head span:not(:first-child) { text-align: right; }
@media (max-width: 760px) {
  .dl-head { display: none; }
  .drow { grid-template-columns: minmax(0, 1fr) auto; padding: 12px 14px; }
  .drow .d-amt { display: none; }
  .drow .d-com { grid-column: 2; grid-row: 1; }
  .drow .d-st { grid-column: 1 / -1; text-align: left; }
}
.track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 22px 0; }
.tstep { position: relative; padding-top: 22px; padding-right: 10px; }
.tstep::before { content: ""; position: absolute; top: 6px; left: 14px; right: 0; height: 2px; background: var(--line); }
.tstep:last-child::before { display: none; }
.tstep i { position: absolute; top: 0; left: 0; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); }
.tstep.done i { background: var(--earned); border-color: var(--earned); }
.tstep.done::before { background: var(--earned); }
.tstep.now i { border-color: var(--waiting); box-shadow: 0 0 0 4px var(--waiting-bg); }
.tstep.bad i { background: var(--rejected); border-color: var(--rejected); }
.tstep b { display: block; font-size: 13.5px; }
.tstep small { color: var(--muted); font-size: 12.5px; }
@media (max-width: 560px) {
  .track { grid-template-columns: 1fr; gap: 14px; }
  .tstep { padding: 0 0 0 26px; }
  .tstep::before { top: 18px; bottom: -14px; left: 6px; right: auto; width: 2px; height: auto; }
}
.cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
.box { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.box h2 { margin-bottom: 10px; }
.big { font-size: 28px; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.facts { display: grid; grid-template-columns: 150px 1fr; gap: 8px 12px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.estimate { position: sticky; top: 20px; background: var(--soft); border-radius: var(--radius); padding: 18px; }
.estimate .big { color: var(--earned); margin: 4px 0 8px; }
.form-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .form-grid { grid-template-columns: 1fr; } .estimate { position: static; } }
.rules-list { list-style: none; padding: 0; margin: 0; }
.rules-list li { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.rules-list li:last-child { border-bottom: 0; }
.rules-list .rate { font-size: 20px; font-weight: 650; min-width: 64px; font-variant-numeric: tabular-nums; }
.rules-list .yours { color: var(--earned); }
.crumbs { display: flex; align-items: center; gap: 4px; margin-bottom: 12px; font-size: 13.5px; }
.crumbs a { color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; gap: 2px; }
.crumbs a:hover { color: var(--ink); }
.est-bar { display: none; }
@media (max-width: 760px) {
  .est-bar { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; position: fixed; left: 0; right: 0; bottom: calc(61px + env(safe-area-inset-bottom)); background: var(--earned-bg); color: var(--earned); padding: 10px 16px; border-top: 1px solid #CBE8D9; z-index: 19; font-weight: 550; }
  .est-bar b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .page.has-est { padding-bottom: 150px; }
}
.helpbtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; color: var(--muted); }
/* ── Finance and manager screens ── */
.acard { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; background: var(--bg); }
.acard.look { border-color: #F0D9A8; box-shadow: inset 3px 0 0 #E0A43A; }
.a-top { display: flex; align-items: center; gap: 10px; }
.a-top .who b { display: block; font-weight: 600; line-height: 1.25; }
.a-top .who small { color: var(--muted); }
.a-mid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; margin: 14px 0 12px; align-items: end; }
.a-mid h3 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.a-mid small { color: var(--muted); }
.a-facts { display: flex; gap: 22px; margin: 0; text-align: right; }
.a-facts dt { font-size: 12px; color: var(--muted); }
.a-facts dd { margin: 0; font-weight: 550; font-variant-numeric: tabular-nums; }
.a-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.a-foot .grow { min-width: 220px; }
.a-reject { margin-top: 12px; display: grid; gap: 8px; }
@media (max-width: 760px) {
  .acard { padding: 14px; }
  .a-mid { grid-template-columns: 1fr; }
  .a-facts { text-align: left; gap: 18px; }
  .a-foot .actions-row { width: 100%; display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }
}
.headline { display: flex; gap: 28px; flex-wrap: wrap; }
.headline div b { display: block; font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.headline div small { color: var(--muted); }
.setup-banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border: 1px solid var(--line); background: var(--soft); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 20px; }
.bar { height: 6px; background: var(--soft-2); border-radius: 4px; overflow: hidden; width: 120px; }
.bar i { display: block; height: 100%; background: var(--earned); }
.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
.stepc { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; }
.stepc > button { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: none; border: 0; text-align: left; cursor: pointer; }
.stepc .n { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 650; font-size: 13px; flex: none; }
.stepc.done .n { background: var(--earned); border-color: var(--earned); color: #fff; }
.stepc .t b { display: block; font-size: 15px; }
.stepc .t small { color: var(--muted); }
.stepc .body { padding: 0 18px 18px 60px; }
@media (max-width: 760px) { .stepc .body { padding: 0 14px 16px; } .stepc > button { padding: 14px; } }
.stepc .body p { margin: 0 0 12px; color: var(--ink-2); max-width: 640px; }
.people { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.person { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.person:last-child { border-bottom: 0; }
.person .grow { min-width: 180px; }
.person .grow b { display: block; font-weight: 600; }

    var rule = api.pickRule(rules, email, product);
    if (!rule) return { amount: 0, rate: 0, label: "No rule", parts: [] };
    var rate = Number(rule.rate) || 0, amount = base * rate / 100, parts = [{ rate: rate, on: base, label: rule.label }];
    rules.filter(function (r) { return r.applies_to === "monthly_bonus" && r.active !== false; })
      .sort(function (a, b) { return (a.threshold || 0) - (b.threshold || 0); })
      .forEach(function (b) {
        var t = Number(b.threshold) || 0, above = Math.max(0, (soldThisMonth + base) - Math.max(t, soldThisMonth));
        if (above > 0) { amount += above * (Number(b.rate) || 0) / 100; parts.push({ rate: Number(b.rate) || 0, on: above, label: b.label, bonus: true, threshold: t }); }
      });
    return { amount: Math.round(amount * 100) / 100, rate: base ? amount / base * 100 : rate, label: rule.label, parts: parts };
  };
  api.soldThisMonth = function (email, month) {
    return api.state.commissions.filter(function (c) { return api.same(c.rep_email, email) && c.month === (month || api.thisMonth()); })
      .reduce(function (s, c) { return s + (Number(c.base) || 0); }, 0);
  };
  /* "10% × ₹2,60,000 = ₹26,000": the line people see everywhere */
  api.cline = function (parts, total, ruleLabel) {
    if (!parts || !parts.length) return '<span class="muted">Nothing in the plan covers this yet</span>';
    var bits = parts.map(function (p, i) { return (i ? '<span class="op">+</span>' : "") + api.pct(p.rate) + ' <span class="op">×</span> ' + api.money(p.on); }).join(" ");
    return '<span class="cline">' + bits + ' <span class="op">=</span> <span class="res money">' + api.money(total) + "</span>" + (ruleLabel ? ' <span class="rule">' + api.esc(ruleLabel) + "</span>" : "") + "</span>";
  };

  /* ── loading ── */
  function flat(r) { var src = r && r.data ? r.data : r; var o = {}; for (var k in src) o[k] = src[k]; o.id = (r && r.id != null) ? r.id : src.id; return o; }
  function items(resp) { return ((resp && (resp.items || resp.data)) || (Array.isArray(resp) ? resp : [])).map(flat); }
  api.load = async function () {
    var out = { denied: [] };
    var res = await Promise.all(TABLES.map(function (t) { return api.client.records.list(t, { limit: 1000 }).catch(function (e) { return { __error: e }; }); }));
    TABLES.forEach(function (t, i) { if (res[i] && res[i].__error) { out[t] = []; out.denied.push(t); } else out[t] = items(res[i]); });
    api.state = out;
    return out;
  };
  api.loadMembers = async function () {
    try { var mm = await api.client.podMembers.list(CFG.podId, { limit: 500 }); api.members = (mm && (mm.items || mm)) || []; } catch (e) { api.members = api.members || []; }
    return api.members;
  };
  api.reloadSoon = (function () { var t; return function (fn) { clearTimeout(t); t = setTimeout(fn, 300); }; })();

  /* ── who is this ── */
  function hasAction(a) { return api.actions.indexOf(a) >= 0; }
  api.memberTeam = function (m) {
    var r = (m && m.roles) || [];
    if (r.indexOf("POD_ADMIN") >= 0 || r.indexOf("POD_EDITOR") >= 0) return "manager";
    if (r.indexOf("FINANCE") >= 0) return "finance";
    if (r.indexOf("POD_USER") >= 0 || r.indexOf("SALES") >= 0) return "sales";
    return "none";
  };
  api.TEAM_LABEL = { manager: "Manager", finance: "Finance", sales: "Sales", none: "Can't use the app yet" };
  api.isManager = function () { return api.team === "manager"; };
  api.canAddPeople = function () { return hasAction("pod.member.manage"); };
  api.myName = function () {
    var me = api.me || {}, m = api.member || {};
    var full = m.user_name || [me.first_name, me.last_name].filter(Boolean).join(" ") || me.name || me.full_name;
    return full || api.first(api.myEmail().split("@")[0]);
  };
  api.myEmail = function () { return (api.me && api.me.email) || (api.member && (api.member.user_email || api.member.email)) || ""; };
  api.memberName = function (m) { return (m && (m.user_name || (m.user && [m.user.first_name, m.user.last_name].filter(Boolean).join(" ")))) || String((m && (m.user_email || m.email)) || "").split("@")[0]; };
  api.managers = function () { return api.members.filter(function (m) { return api.memberTeam(m) === "manager"; }); };
  api.managerNames = function () {
    var n = api.managers().filter(function (m) { return !api.same(m.user_email || m.email, api.myEmail()); }).map(function (m) { return api.first(api.memberName(m)); });
    if (!n.length) return "your manager";
    return n.length === 1 ? n[0] : n.slice(0, -1).join(", ") + " or " + n[n.length - 1];
  };
  api.lemmaUrl = function (path) { return (CFG.authUrl ? CFG.authUrl.replace(/\/auth\/?$/, "") : "https://lemma.work") + "/t/" + CFG.podId + (path || "/home"); };

  /* ── first open by a manager: lock the money tables to the right people ──
     Commissions, the plan, products and settings are RESTRICTED in this template, so until this runs only the
     person who installed it can read them. This gives each Lemma role its access, once:
       User (Sales): reads the plan, products, settings and their commissions
       FINANCE: also writes commissions (approve, pay out) and runs approve_deal
       Editor / Admin (Managers): change everything */
  var R = ["datastore.table.read", "datastore.record.read"], RW = R.concat(["datastore.record.write"]), RUN = ["function.read", "function.execute"];
  var ACCESS = [
    ["datastore_table", "commissions", { POD_USER: R, FINANCE: RW, POD_EDITOR: RW, POD_ADMIN: RW }],
    ["datastore_table", "commission_rules", { POD_USER: R, FINANCE: R, POD_EDITOR: RW, POD_ADMIN: RW }],
    ["datastore_table", "products", { POD_USER: R, FINANCE: R, POD_EDITOR: RW, POD_ADMIN: RW }],
    ["datastore_table", "settings", { POD_USER: R, FINANCE: R, POD_EDITOR: RW, POD_ADMIN: RW }],
    ["datastore_table", "invites", { POD_USER: R, FINANCE: R, POD_EDITOR: RW, POD_ADMIN: RW }],
    ["function", "approve_deal", { FINANCE: RUN, POD_EDITOR: RUN, POD_ADMIN: RUN }]
  ];
  api.ensureAccess = async function () {
    var s = api.settings(), setup = (s.setup && typeof s.setup === "object") ? s.setup : {};
    if (setup.access === ACCESS_VERSION || !api.canAddPeople()) return false;
    var pod = CFG.podId;
    var list = async function () { var rr = await api.client.podRoles.list(pod); return (rr && (rr.items || rr)) || []; };
    var roles = await list();
    if (!roles.some(function (r) { return r.name === "FINANCE"; })) {
      await api.client.podRoles.create({ name: "FINANCE", description: "Sales commissions: approves deals and marks payouts", permission_ids: [] }, pod);
      roles = await list();
    }
    var idOf = {}; roles.forEach(function (r) { idOf[r.name] = r.id; });
    for (var i = 0; i < ACCESS.length; i++) {
      var a = ACCESS[i];
      try { // keep it locked even if an install didn't carry the visibility over
        var cur = a[0] === "function" ? await api.client.functions.get(a[1]) : await api.client.tables.get(a[1]);
        if (cur && cur.visibility && cur.visibility !== "RESTRICTED") await (a[0] === "function" ? api.client.functions : api.client.tables).update(a[1], { visibility: "RESTRICTED" });
      } catch (e) { /* the grant below still applies */ }
      for (var role in a[2]) if (idOf[role]) await api.client.resourceAccess.replaceGrant(a[0], a[1], "ROLE", idOf[role], { permission_ids: a[2][role] }, pod);
    }
    setup.access = ACCESS_VERSION;
    await api.saveSettings({ setup: setup });
    return true;
  };
  api.saveSettings = async function (patch) {
    var s = api.settings();
    if (s.id) await api.client.records.update("settings", s.id, patch);
    else await api.client.records.create("settings", Object.assign({ currency_symbol: "₹", locale: "en-IN" }, patch));
    await api.load();
  };
  api.setupState = function () { var s = api.settings().setup; return (s && typeof s === "object") ? s : {}; };
  api.markSetup = async function (key) { var st = Object.assign({}, api.setupState()); st[key] = true; await api.saveSettings({ setup: st }); };

  /* Lemma invitations can only carry Lemma's own roles, so a Finance invitee joins as a User. The next time a
     manager opens the app, anyone who has joined since gets the team they were invited to. */
  api.applyInvites = async function () {
    if (!api.canAddPeople()) return false;
    var changed = false, pending = (api.state.invites || []).filter(function (i) { return i.status !== "joined"; });
    for (var k = 0; k < pending.length; k++) {
      var inv = pending[k], m = api.members.filter(function (x) { return api.same(x.user_email || x.email, inv.email); })[0];
      if (!m) continue;
      try {
        var want = api.rolesFor(inv.team, m.roles);
        if (want.join() !== (m.roles || []).join()) await api.client.podMembers.updateRoles(CFG.podId, m.pod_member_id, want);
        await api.client.records.update("invites", inv.id, { status: "joined" });
        changed = true;
      } catch (e) { /* try again next time */ }
    }
    if (changed) { await api.loadMembers(); await api.load(); await api.syncFinanceEmails(); }
    return changed;
  };
  api.rolesFor = function (team, current) {
    var keep = (current || []).filter(function (r) { return ["POD_ADMIN", "POD_EDITOR", "POD_USER", "POD_VIEWER", "FINANCE", "SALES"].indexOf(r) < 0; });
    if (team === "manager") return ["POD_ADMIN"].concat(keep);
    if (team === "finance") return ["POD_USER", "FINANCE"].concat(keep);
    return ["POD_USER"].concat(keep);
  };
  /* Tally sends the morning list to whoever is in Finance (or the managers, until someone is) */
  api.syncFinanceEmails = async function () {
    var pick = function (t) { return api.members.filter(function (m) { return api.memberTeam(m) === t; }).map(function (m) { return m.user_email || m.email; }).filter(Boolean); };
    var emails = pick("finance"); if (!emails.length) emails = pick("manager");
    var want = emails.sort().join(", ");
    if ((api.settings().finance_emails || "") !== want) { try { await api.saveSettings({ finance_emails: want }); } catch (e) {} }
  };

  /* ── per person: which intros they've seen (kept in Lemma, so it follows them to any device) ── */
  api.seen = function (key) {
    if ((api.state.seen || []).some(function (r) { return r.what === key; })) return true;
    try { return localStorage.getItem("sc-seen:" + api.myEmail() + ":" + key) === "1"; } catch (e) { return false; }
  };
  api.markSeen = async function (key) {
    try { localStorage.setItem("sc-seen:" + api.myEmail() + ":" + key, "1"); } catch (e) {}
    if (api.seen(key) && (api.state.seen || []).some(function (r) { return r.what === key; })) return;
    try { var rec = await api.client.records.create("seen", { what: key }); api.state.seen.push({ what: key, id: rec && rec.id }); } catch (e) {}
  };

  /* ── boot: load the SDK from the API host, sign in, work out who this is, load data ── */
  api.boot = function (onReady, onFail) {
    var base = (CFG.apiUrl || window.location.origin).replace(/\/$/, "");
    var s = document.createElement("script");
    s.src = base + "/public/sdk/lemma-client.js";
    s.onerror = function () { onFail("Couldn't reach Lemma. Check your connection and reload."); };
    s.onload = async function () {
      try {
        api.client = new window.LemmaClient.LemmaClient();
        var st = await api.client.initialize();
        if (!st || st.status !== "authenticated") { api.client.auth.redirectToAuth(); return; }
        api.me = st.user || {};
        var podId = CFG.podId;
        try { api.member = await api.client.podMembers.lookupByUserId(podId, api.me.id); api.roles = (api.member && api.member.roles) || []; } catch (e) { api.roles = []; }
        try { var mine = await api.client.podPermissions.me(podId); api.actions = (mine && (mine.actions || mine.permissions)) || []; } catch (e) { api.actions = []; }
        api.team = api.memberTeam({ roles: api.roles });
        // organisation owners reach every space without being in it: treat them as managers
        if (api.team === "none" && hasAction("app.update")) api.team = "manager";
        await Promise.all([api.load(), api.loadMembers()]);
        if (api.isManager()) {
          try { if (await api.ensureAccess()) await api.load(); } catch (e) { api.accessError = api.errText(e); }
          try { await api.applyInvites(); } catch (e) {}
          try { await api.syncFinanceEmails(); } catch (e) {}
        }
        try { var ag = await api.client.agents.get("tally"); if (ag && ag.id) api.tally.seed = ag.id; } catch (e) {}
        try {
          var sf = await api.client.podSurfaces.list(podId);
          (sf && (sf.items || sf) || []).forEach(function (x) { if (x.agent_name === "tally" && x.platform === "RESEND" && x.surface_identity_email) api.tally.email = x.surface_identity_email; });
        } catch (e) {}
        onReady(true);
        try { api.client.datastore.watchChanges({ onChange: function () { api.reloadSoon(function () { api.load().then(function () { onReady(false); }); }); } }); } catch (e) { /* polling below keeps it fresh */ }
        setInterval(function () { if (!document.hidden) api.load().then(function () { onReady(false); }); }, 30000);
      } catch (e) { onFail(api.errText(e)); }
    };
    document.head.appendChild(s);
  };

  /* ── toast + sheet ── */
  var toastTimer;
  api.toast = function (html) {
    var el = document.getElementById("toast");
    if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.innerHTML = html; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 5000);
  };
  api.sheet = function (html, wire) {
    var scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + "</div>";
    var close = function () { scrim.remove(); document.removeEventListener("keydown", onKey); };
    var onKey = function (e) { if (e.key === "Escape") close(); };
    scrim.addEventListener("click", function (e) { if (e.target === scrim) close(); });
    document.addEventListener("keydown", onKey);
    document.body.appendChild(scrim);
    var f = scrim.querySelector("input, textarea, select, button.dark"); if (f) f.focus();
    if (wire) wire(scrim, close);
    return close;
  };
  api.copy = function (text, what) {
    var done = function () { api.toast("Copied " + api.esc(what || "") + "."); };
    try { navigator.clipboard.writeText(text).then(done, function () { window.prompt("Copy this:", text); }); } catch (e) { window.prompt("Copy this:", text); }
  };

  /* ── Tally introduces itself: one card per step, then hands over to the page tour ── */
  api.intro = function (steps, onDone) {
    var i = 0, scrim = document.createElement("div");
    scrim.className = "intro-scrim";
    document.body.appendChild(scrim);
    function finish(skipped) { scrim.remove(); document.removeEventListener("keydown", onKey); onDone && onDone(skipped); }
    function onKey(e) { if (e.key === "Escape") finish(true); }
    function show() {
      var st = steps[i], last = i === steps.length - 1;
      scrim.innerHTML = '<div class="intro" role="dialog" aria-modal="true" aria-labelledby="intro-t" aria-describedby="intro-b">' + api.tallyFace("bob") +
        '<div class="name">Tally · your commissions teammate</div><h2 id="intro-t">' + api.esc(st.title) + '</h2><p id="intro-b">' + st.body + "</p>" +
        '<div class="dots" aria-hidden="true">' + steps.map(function (_, k) { return '<i class="' + (k === i ? "on" : "") + '"></i>'; }).join("") + "</div>" +
        '<div class="actions">' + (last ? "" : '<button class="linkbtn" data-i="skip">Skip</button>') + '<span class="grow"></span>' + (i ? '<button class="btn" data-i="back">Back</button>' : "") +
        '<button class="btn dark" data-i="next">' + api.esc(last ? (st.cta || "Let’s go") : "Next") + "</button></div></div>";
      scrim.querySelector('[data-i="next"]').focus();
    }
    scrim.addEventListener("click", function (e) {
      var t = e.target.closest && e.target.closest("[data-i]"); if (!t) return;
      var k = t.getAttribute("data-i");
      if (k === "skip") finish(true);
      if (k === "back") { i--; show(); }
      if (k === "next") { if (i === steps.length - 1) finish(false); else { i++; show(); } }
    });
    document.addEventListener("keydown", onKey);
    show();
  };

  /* ── page tour: steps point at elements with [data-tour="key"] ── */
  api.tour = function (steps, onDone) {
    steps = steps.filter(function (s) { var el = document.querySelector('[data-tour="' + s.target + '"]'); return el && el.getClientRects().length; });
    if (!steps.length) { onDone && onDone(); return; }
    var i = 0, hole = document.createElement("div"), card = document.createElement("div");
    hole.className = "tour-hole"; card.className = "tour-card"; card.setAttribute("role", "dialog"); card.setAttribute("aria-live", "polite");
    document.body.appendChild(hole); document.body.appendChild(card);
    function done() { hole.remove(); card.remove(); window.removeEventListener("resize", show); onDone && onDone(); }
    function show() {
      var st = steps[i], el = document.querySelector('[data-tour="' + st.target + '"]');
      if (el && el.getClientRects().length) {
        el.scrollIntoView({ block: "center" });
        var r = el.getBoundingClientRect(), pad = 6;
        hole.style.cssText = "display:block;left:" + (r.left - pad) + "px;top:" + (r.top - pad) + "px;width:" + (r.width + pad * 2) + "px;height:" + (r.height + pad * 2) + "px";
        var top = r.bottom + 12, left = Math.min(Math.max(12, r.left), window.innerWidth - 332);
        if (top + 210 > window.innerHeight) top = Math.max(12, r.top - 222);
        card.style.left = left + "px"; card.style.top = top + "px";
      }
      card.innerHTML = '<div class="who-says">' + api.tallyFace() + '<span class="step">' + (i + 1) + " of " + steps.length + "</span></div><h3>" + api.esc(st.title) + "</h3><p>" + st.body + '</p><div class="actions">' +
        '<button class="linkbtn" data-t="skip">Skip</button><span class="grow"></span>' + (i ? '<button class="btn sm" data-t="back">Back</button>' : "") +
        '<button class="btn sm dark" data-t="next">' + (i === steps.length - 1 ? "Got it" : "Next") + "</button></div>";
      card.querySelector('[data-t="next"]').focus();
    }
    card.addEventListener("click", function (e) {
      var t = e.target.getAttribute("data-t");
      if (t === "skip") done();
      if (t === "back") { i--; show(); }
      if (t === "next") { if (i === steps.length - 1) done(); else { i++; show(); } }
    });
    window.addEventListener("resize", show);
    show();
  };

  api.fail = function (msg) {
    document.getElementById("app").innerHTML = '<div class="center"><div><h1>Couldn’t open this</h1><p class="sub">' + api.esc(msg) + '</p><p><button class="btn" onclick="location.reload()">Try again</button></p></div></div>';
  };
  return api;
})();

</script>
<script>
/* ── Sales commissions: the screens ──────────────────────────────────────────
   Sales:   My deals · Log a deal · Commission plan (read only)
   Finance: Approvals · Payouts · Team · Commission plan (read only)
   Manager: Overview · People · Commission plan (edit) · Settings, and can switch to the Finance and Sales screens.
   Everyone always acts as themselves: deals are logged under the signed-in person, approvals carry the approver's name. */
(function () {
  var esc = CM.esc, money = CM.money, ico = CM.ico, sum = CM.sum, plural = CM.plural;
  var S = { mode: null, form: null, formErr: {}, logBusy: false, busy: {}, err: {}, rejecting: {}, rejectText: {}, month: null, open: {}, draft: {}, tryit: { rep: "", product: "", amount: "100000" }, peopleBusy: "" };
  var MODE_INFO = {
    manager: ["Manager", "See everyone, add people, set the plan"],
    finance: ["Finance", "Approve deals and pay out"],
    sales: ["Sales", "Log your own deals, see your commission"]
  };
  function me() { return { name: CM.myName(), email: CM.myEmail() }; }
  function phone() { return window.innerWidth <= 760; }

  /* ── which screens this person gets ── */
  function modes() { return CM.team === "manager" ? ["manager", "finance", "sales"] : CM.team === "finance" ? ["finance"] : CM.team === "sales" ? ["sales"] : []; }
  function mode() {
    var m = modes();
    if (S.mode && m.indexOf(S.mode) >= 0) return S.mode;
    var saved = null; try { saved = localStorage.getItem("sc-mode:" + CM.myEmail()); } catch (e) {}
    return m.indexOf(saved) >= 0 ? saved : m[0];
  }
  function setMode(m) {
    S.mode = m; try { localStorage.setItem("sc-mode:" + CM.myEmail(), m); } catch (e) {}
    if (location.hash && location.hash !== "#/") location.hash = "#/"; else render();
    window.scrollTo(0, 0); maybeIntro(false);
  }

  /* ── data helpers ── */
  function lineFor(deal) { return CM.state.commissions.filter(function (c) { return c.deal_id === deal.id; })[0] || null; }
  function baseOf(d) { return d.payment_status === "part_paid" ? (Number(d.amount_received) || 0) : (Number(d.amount) || 0); }
  function priced(d) { return CM.workOut(CM.state.commission_rules, d.rep_email, d.product, baseOf(d), CM.soldThisMonth(d.rep_email)); }
  function myDeals() {
    var m = me();
    return CM.state.deals.filter(function (d) { return CM.same(d.rep_email, m.email); })
      .sort(function (a, b) { return String(b.closed_on || b.created_at || "").localeCompare(String(a.closed_on || a.created_at || "")) || String(b.created_at).localeCompare(String(a.created_at)); });
  }
  function stage(d) {
    var line = lineFor(d);
    if (d.status === "rejected") return { cls: "rejected", label: "Not approved" };
    if (d.status === "approved") return line && line.status === "paid_out" ? { cls: "paid", label: "Paid out" } : { cls: "approved", label: "Approved" };
    if (!d.check_status) return { cls: "checking", label: "Being checked" };
    if (d.check_status === "needs_a_look") return { cls: "look", label: "Needs a look" };
    return { cls: "waiting", label: "With finance" };
  }
  function waitingDeals() {
    return CM.state.deals.filter(function (d) { return d.status === "waiting"; }).sort(function (a, b) {
      var la = a.check_status === "needs_a_look" ? 0 : 1, lb = b.check_status === "needs_a_look" ? 0 : 1;
      return la - lb || String(a.created_at).localeCompare(String(b.created_at));
    });
  }
  /* salespeople: everyone in the Sales team, plus anyone who has logged a deal */
  function salesPeople() {
    var seen = {}, out = [];
    var add = function (name, email) { var k = String(email || "").toLowerCase(); if (k && !seen[k]) { seen[k] = 1; out.push({ name: name || email, email: email }); } };
    CM.members.forEach(function (m) { if (CM.memberTeam(m) === "sales") add(CM.memberName(m), m.user_email || m.email); });
    CM.state.deals.concat(CM.state.commissions).forEach(function (d) { add(d.rep_name, d.rep_email); });
    return out.sort(function (a, b) { return String(a.name).localeCompare(b.name); });
  }
  function products(all) { return CM.state.products.filter(function (p) { return all || p.active !== false; }).sort(function (a, b) { return String(a.name).localeCompare(b.name); }); }
  function productRule(name) { return CM.state.commission_rules.filter(function (r) { return r.applies_to === "product" && CM.same(r.match, name); })[0] || null; }
  function stdRule() { return CM.state.commission_rules.filter(function (r) { return r.applies_to === "everyone" && r.active !== false; })[0] || null; }
  function tallyMail() { return CM.tally.email ? '<a href="mailto:' + esc(CM.tally.email) + '">' + esc(CM.tally.email) + "</a>" : ""; }
  function company() { return CM.settings().company || ""; }

  /* ═══ SALES ═══ */
  function viewHome() {
    var m = me(), deals = myDeals(), lines = CM.state.commissions.filter(function (c) { return CM.same(c.rep_email, m.email); });
    var month = CM.thisMonth();
    var earned = lines.filter(function (c) { return c.month === month; });
    var waiting = deals.filter(function (d) { return d.status === "waiting"; });
    var paid = lines.filter(function (c) { return c.status === "paid_out"; });
    var lastPaid = paid.map(function (c) { return c.paid_out_on || ""; }).sort().pop();
    var head = '<div class="page-head"><div><h1>Hi ' + esc(CM.first(m.name)) + '</h1><p class="sub">' + CM.monthName(month, true) + "</p></div>" +
      '<div class="row"><button class="helpbtn" data-replay aria-label="Show me around">' + ico("help") + '</button><a class="btn dark" href="#/log" data-tour="log">' + ico("plus", 16) + "Log a deal</a></div></div>";
    var stats = '<div class="stats" data-tour="stats">' +
      '<div class="stat"><label><i style="background:var(--earned)"></i>Earned in ' + CM.monthName(month) + "</label><b>" + money(sum(earned, function (c) { return c.amount; })) + "</b><small>" + plural(earned.length, "deal") + " approved</small></div>" +
      '<div class="stat"><label><i style="background:var(--waiting)"></i>Waiting for finance</label><b>' + money(sum(waiting, function (d) { return d.expected_commission; })) + "</b><small>" + plural(waiting.length, "deal") + ", if approved as they are</small></div>" +
      '<div class="stat"><label><i style="background:var(--ink)"></i>Paid out so far</label><b>' + money(sum(paid, function (c) { return c.amount; })) + "</b><small>" + (lastPaid ? "Last payout " + CM.day(lastPaid) : "Nothing paid out yet") + "</small></div></div>";
    var list = deals.length ? '<div class="dl" data-tour="deals"><div class="dl-head"><span>Deal</span><span>Value</span><span>Commission</span><span>Status</span></div>' + deals.map(function (d) {
      var st = stage(d), line = lineFor(d), com;
      if (line) com = '<div class="d-com">' + money(line.amount) + "</div>";
      else if (d.status === "rejected") com = '<div class="d-com soft">—</div>';
      else com = '<div class="d-com soft" title="If approved as it is">≈ ' + money(d.expected_commission != null ? d.expected_commission : priced(d).amount) + "</div>";
      var note = "";
      if (d.status === "rejected" && d.finance_note) note = '<div class="d-note note rejected">Finance: ' + esc(d.finance_note) + "</div>";
      else if (d.status === "waiting" && d.check_status === "needs_a_look" && d.check_note) note = '<div class="d-note note look">' + esc(d.check_note) + "</div>";
      return '<a class="drow" href="#/deal/' + esc(d.id) + '"><div class="d-main"><b>' + esc(d.customer) + "</b><small>" + esc(d.product || "") + (d.closed_on ? " · " + CM.day(d.closed_on) : "") + '</small></div><div class="d-amt">' + money(d.amount) + "</div>" + com + '<div class="d-st"><span class="chip ' + st.cls + '">' + st.label + "</span></div>" + note + "</a>";
    }).join("") + "</div>" : '<div class="empty" data-tour="deals"><b>No deals logged yet</b>Log each deal you close. Tally checks it and works out your commission.<p><a class="btn dark" href="#/log">Log your first deal</a></p></div>';
    var say = CM.tally.email ? '<div class="say">' + CM.tallyFace() + '<div><b>On the move?</b><p>Email me the deal from your work email and I’ll log it for you: ' + tallyMail() + '.</p><q>“Closed Bluefin, Annual plan, 3,00,000 before tax, paid in full, INV-2061”</q></div></div>' : "";
    return head + stats + '<div class="section">Your deals <span>' + deals.length + "</span></div>" + list + say;
  }

  function viewDeal(id) {
    var m = me(), d = CM.state.deals.filter(function (x) { return x.id === id; })[0];
    var crumbs = '<div class="crumbs"><a href="#/">' + ico("back", 16) + "Your deals</a></div>";
    if (!d) return crumbs + '<div class="empty"><b>That deal isn’t here</b>It may have been removed.</div>';
    if (!CM.same(d.rep_email, m.email)) return crumbs + '<div class="empty"><b>That’s someone else’s deal</b>You can see your own deals here.</div>';
    var line = lineFor(d), st = stage(d);
    var steps = [
      { k: "done", b: "Logged", s: (d.created_at ? CM.day(d.created_at) : CM.day(d.closed_on)) + (d.logged_via && d.logged_via !== "app" ? " · by " + esc(d.logged_via) : "") },
      d.check_status ? { k: "done", b: "Checked by Tally", s: d.check_status === "needs_a_look" ? "Needs a look" : "Looks right" } : { k: "now", b: "Tally is checking", s: "Usually under a minute" },
      d.status === "approved" ? { k: "done", b: "Approved", s: "by " + esc(CM.first(d.reviewed_by)) + " · " + CM.day(d.reviewed_at) } :
        d.status === "rejected" ? { k: "bad", b: "Not approved", s: "by " + esc(CM.first(d.reviewed_by)) + " · " + CM.day(d.reviewed_at) } :
        { k: d.check_status ? "now" : "", b: "Finance approves", s: "Waiting" },
      line && line.status === "paid_out" ? { k: "done", b: "Paid out", s: CM.day(line.paid_out_on) } : { k: line ? "now" : "", b: "Paid out", s: line ? "With the next payout" : "After approval" }
    ];
    var track = '<div class="track" aria-label="Where this deal is">' + steps.map(function (x) { return '<div class="tstep ' + x.k + '"><i></i><b>' + x.b + "</b><small>" + x.s + "</small></div>"; }).join("") + "</div>";
    var com;
    if (line) com = '<div class="box"><h2>Commission</h2><div class="big">' + money(line.amount) + '</div><p class="muted" style="margin:0">On ' + money(line.base) + " received · " + esc(line.rule_used || "") + "</p></div>";
    else if (d.status === "rejected") com = '<div class="box"><h2>Finance didn’t approve this</h2><p class="note rejected" style="margin:0 0 12px">' + esc(d.finance_note || "No reason given.") + '</p><a class="btn" href="#/log/again/' + esc(d.id) + '">Fix it and log again</a></div>';
    else {
      var e = priced(d);
      com = '<div class="box"><h2>If approved as it is</h2><div class="big" style="color:var(--earned)">' + money(e.amount) + "</div>" + CM.cline(e.parts, e.amount) +
        (d.payment_status === "part_paid" ? '<p class="muted" style="margin:8px 0 0">Commission is paid on what the customer has paid so far.</p>' : "") +
        (d.payment_status === "not_paid" ? '<p class="muted" style="margin:8px 0 0">Finance approves once the customer has paid.</p>' : "") + "</div>";
    }
    var check = '<div class="box" style="margin-top:20px"><div class="row" style="margin-bottom:10px">' + CM.tallyFace().replace('class="tally ', 'style="width:28px;height:28px" class="tally ') + "<h2>Tally’s check</h2></div>" +
      (d.check_status ? '<p class="note ' + (d.check_status === "needs_a_look" ? "look" : "ok") + '" style="margin:0">' + esc(d.check_note || "") + "</p>" : '<p class="muted" style="margin:0"><span class="chip checking">Checking</span> Payment, duplicates and the amount, then it goes to finance.</p>') + "</div>";
    var facts = '<div class="box"><div class="row" style="margin-bottom:10px"><h2 class="grow">Deal</h2>' + (d.status === "waiting" ? '<button class="btn sm" id="edit">Edit</button>' : "") + '</div><dl class="facts">' +
      "<dt>Customer</dt><dd>" + esc(d.customer) + (d.customer_email ? '<br><span class="muted">' + esc(d.customer_email) + "</span>" : "") + "</dd>" +
      "<dt>Product</dt><dd>" + esc(d.product || "—") + "</dd>" +
      "<dt>Value before tax</dt><dd class=\"num\">" + money(d.amount) + "</dd>" +
      "<dt>Payment</dt><dd>" + esc(CM.payLabel[d.payment_status] || "") + (d.payment_status === "part_paid" ? " · " + (d.amount_received ? money(d.amount_received) + " received" : "amount received not filled in") : "") + "</dd>" +
      "<dt>Reference</dt><dd>" + esc(d.payment_ref || "—") + "</dd>" +
      "<dt>Closed</dt><dd>" + (CM.day(d.closed_on) || "—") + "</dd>" +
      (d.notes ? "<dt>Notes</dt><dd>" + esc(d.notes) + "</dd>" : "") + "</dl></div>";
    return crumbs + '<div class="page-head"><div><h1>' + esc(d.customer) + '</h1><p class="sub">' + esc(d.product || "") + " · " + money(d.amount) + '</p></div><span class="chip ' + st.cls + '">' + st.label + "</span></div>" +
      track + '<div class="cols"><div>' + com + check + "</div>" + facts + "</div>";
  }

  function blankForm(from) {
    var f = { customer: "", customer_email: "", product: "", productOther: false, amount: "", closed_on: CM.today(), payment_status: "paid_in_full", amount_received: "", payment_ref: "", notes: "" };
    if (from) Object.keys(f).forEach(function (k) { if (from[k] != null && k !== "closed_on" && k !== "productOther") f[k] = from[k]; });
    var names = products().map(function (p) { return p.name; });
    if (f.product && names.length && names.indexOf(f.product) < 0) f.productOther = true;
    return f;
  }
  function viewLog() {
    var m = me(), f = S.form, e = S.formErr;
    var base = f.payment_status === "part_paid" ? (Number(f.amount_received) || 0) : (Number(f.amount) || 0);
    var est = CM.workOut(CM.state.commission_rules, m.email, f.product, base, CM.soldThisMonth(m.email));
    var fld = function (key, label, input, hint) { return '<div class="field"><label for="f-' + key + '">' + label + "</label>" + input + (e[key] ? '<span class="err" id="e-' + key + '">' + esc(e[key]) + "</span>" : hint ? '<span class="hint">' + hint + "</span>" : "") + "</div>"; };
    var inp = function (key, type, extra) { return '<input class="input" id="f-' + key + '" name="' + key + '" type="' + type + '" value="' + esc(f[key]) + '"' + (e[key] ? ' aria-invalid="true" aria-describedby="e-' + key + '"' : "") + (extra || "") + ">"; };
    var names = products().map(function (p) { return p.name; });
    var prod;
    if (names.length) {
      var pick = f.productOther ? "__other" : f.product;
      prod = '<select class="input" id="f-product_pick" aria-label="Product"><option value=""' + (pick ? "" : " selected") + ">Pick a product</option>" + names.map(function (n) { return '<option value="' + esc(n) + '"' + (pick === n ? " selected" : "") + ">" + esc(n) + "</option>"; }).join("") + '<option value="__other"' + (pick === "__other" ? " selected" : "") + ">Something else</option></select>" +
        (f.productOther ? '<input class="input" style="margin-top:8px" id="f-product" name="product" type="text" placeholder="What did you sell?" value="' + esc(f.product) + '">' : "");
      prod = fld("product_pick", "Product", prod, "So the right rate applies");
    } else prod = fld("product", "Product <span class=\"muted\">(optional)</span>", inp("product", "text"), "What you sold");
    var seg = '<div class="seg" role="group" aria-label="Payment">' + [["paid_in_full", "Paid in full"], ["part_paid", "Part paid"], ["not_paid", "Not paid yet"]].map(function (p) { return '<button type="button" data-pay="' + p[0] + '" aria-pressed="' + (f.payment_status === p[0]) + '">' + p[1] + "</button>"; }).join("") + "</div>";
    var form = '<form id="logform" novalidate>' +
      fld("customer", "Customer", inp("customer", "text", ' autocomplete="organization" required')) +
      '<div class="two">' + prod + fld("amount", "Deal value before tax", inp("amount", "number", ' inputmode="decimal" min="0" step="any" required')) + "</div>" +
      '<div class="field"><label>Payment</label>' + seg + "</div>" +
      (f.payment_status === "part_paid" ? fld("amount_received", "Received so far, before tax", inp("amount_received", "number", ' inputmode="decimal" min="0" step="any"'), "Commission is paid on this now, and on the rest once it’s paid") : "") +
      '<div class="two">' + fld("payment_ref", "Invoice or payment reference", inp("payment_ref", "text"), "Finance checks the payment against this") +
      fld("closed_on", "Closed on", inp("closed_on", "date")) + "</div>" +
      fld("customer_email", "Customer email <span class=\"muted\">(optional)</span>", inp("customer_email", "email", ' autocomplete="email"')) +
      fld("notes", "Anything finance should know <span class=\"muted\">(optional)</span>", '<textarea class="input" id="f-notes" name="notes">' + esc(f.notes) + "</textarea>") +
      '<p class="muted" style="font-size:13px;margin:-4px 0 16px">Logged as you, ' + esc(m.name) + ".</p>" +
      '<div class="row"><button class="btn dark" type="submit" ' + (S.logBusy ? "disabled" : "") + ">" + (S.logBusy ? "Logging…" : "Log deal") + '</button><a class="btn ghost" href="#/">Cancel</a></div></form>';
    var side = '<aside class="estimate" aria-live="polite" data-tour="estimate"><div class="muted" style="font-weight:550">You’d earn</div><div class="big">' + money(est.amount) + "</div>" +
      (base ? CM.cline(est.parts, est.amount) : '<span class="muted">Fill in the deal value to see it.</span>') +
      '<p class="muted" style="margin:12px 0 0;font-size:13px">Worked out from your team’s commission plan. Finance confirms the payment and approves; the final amount uses the plan on that day.</p></aside>';
    return '<div class="crumbs"><a href="#/">' + ico("back", 16) + "Your deals</a></div>" +
      '<div class="page-head"><div><h1>Log a deal</h1><p class="sub">Tally checks it, then finance approves it.</p></div></div>' +
      '<div class="form-grid">' + form + side + "</div>" +
      '<div class="est-bar" aria-hidden="true"><span>You’d earn</span><b>' + money(est.amount) + "</b></div>";
  }

  /* the plan, in plain words (Sales and Finance) */
  function viewPlanRead() {
    var m = me(), rules = CM.state.commission_rules.filter(function (r) { return r.active !== false; });
    var mine = rules.filter(function (r) { return r.applies_to === "salesperson" && CM.same(r.match, m.email); })[0];
    var std = stdRule(), items = [];
    if (mine) items.push('<li><span class="rate yours">' + CM.pct(mine.rate) + "</span><div><b>Your rate</b><div class=\"muted\">It applies to every deal you close, whatever the product.</div></div></li>");
    if (std) items.push('<li><span class="rate">' + CM.pct(std.rate) + "</span><div><b>Standard rate</b><div class=\"muted\">Of what the customer pays, before tax" + (mine ? ", for salespeople without their own rate" : "") + ".</div></div></li>");
    rules.filter(function (r) { return r.applies_to === "product"; }).forEach(function (r) { items.push('<li><span class="rate">' + CM.pct(r.rate) + "</span><div><b>" + esc(r.match) + '</b><div class="muted">On this product' + (mine ? " (your own rate comes first)" : "") + ".</div></div></li>"); });
    rules.filter(function (r) { return r.applies_to === "monthly_bonus"; }).forEach(function (r) { items.push('<li><span class="rate">+' + CM.pct(r.rate) + "</span><div><b>" + esc(r.label || "Monthly bonus") + '</b><div class="muted">Once your approved sales pass ' + money(r.threshold) + " in a month, everything above that earns an extra " + CM.pct(r.rate) + ".</div></div></li>"); });
    if (CM.team !== "sales") rules.filter(function (r) { return r.applies_to === "salesperson"; }).forEach(function (r) { var p = salesPeople().filter(function (x) { return CM.same(x.email, r.match); })[0]; items.push('<li><span class="rate">' + CM.pct(r.rate) + "</span><div><b>" + esc(p ? p.name : r.match) + '</b><div class="muted">Their own rate, on every deal.</div></div></li>'); });
    return '<div class="page-head"><div><h1>Commission plan</h1><p class="sub">How commission is worked out. Commission is paid on money the customer has actually paid.</p></div></div>' +
      (items.length ? '<div class="box"><ul class="rules-list">' + items.join("") + "</ul></div>" : '<div class="empty"><b>No plan yet</b>' + esc(CM.managerNames()) + " hasn’t set the rates yet.</div>") +
      '<div class="say">' + CM.tallyFace() + "<div><b>Want a change?</b><p>" + esc(CM.managerNames()) + " sets the plan. Changes apply to deals approved from then on.</p></div></div>";
  }

  /* ═══ FINANCE ═══ */
  function approvalCard(d) {
    var p = priced(d), look = d.check_status === "needs_a_look", busy = S.busy[d.id], err = S.err[d.id];
    var canApprove = d.payment_status !== "not_paid" && baseOf(d) > 0;
    var why = d.payment_status === "not_paid" ? "Approve once the customer has paid" : (d.payment_status === "part_paid" && !(Number(d.amount_received) > 0)) ? "Fill in what’s been received first" : "";
    var check = d.check_status ? '<p class="note ' + (look ? "look" : "ok") + '" style="margin:0"><b>' + (look ? "Needs a look" : "Looks right") + ":</b> " + esc(d.check_note || "") + "</p>"
      : '<p class="note ok" style="margin:0"><span class="chip checking">Checking</span> Tally is checking this deal.</p>';
    var recv = (d.payment_status === "part_paid" && !(Number(d.amount_received) > 0)) ? '<div class="row" style="margin-top:10px;flex-wrap:wrap"><label for="rcv-' + esc(d.id) + '" class="muted">Received so far, before tax</label><input class="input" style="width:160px" type="number" inputmode="decimal" id="rcv-' + esc(d.id) + '"><button class="btn sm" data-rcv="' + esc(d.id) + '">Save</button></div>' : "";
    var reject = S.rejecting[d.id] ? '<div class="a-reject"><label for="why-' + esc(d.id) + '" style="font-weight:550">Why aren’t you approving it? ' + esc(CM.first(d.rep_name)) + ' sees this.</label><textarea class="input" id="why-' + esc(d.id) + '" data-why="' + esc(d.id) + '">' + esc(S.rejectText[d.id] || "") + '</textarea><div class="row"><button class="btn danger" data-confirm-reject="' + esc(d.id) + '">Don’t approve</button><button class="btn ghost" data-cancel-reject="' + esc(d.id) + '">Cancel</button></div></div>' : "";
    return '<article class="acard' + (look ? " look" : "") + '" data-tour="card">' +
      '<div class="a-top">' + CM.av(d.rep_name) + '<div class="who grow"><b>' + esc(d.rep_name) + "</b><small>Logged " + CM.day(d.created_at) + (d.logged_via && d.logged_via !== "app" ? " by " + esc(d.logged_via) : "") + "</small></div>" + (look ? '<span class="chip look">Needs a look</span>' : d.check_status ? '<span class="chip waiting">Looks right</span>' : '<span class="chip checking">Checking</span>') + "</div>" +
      '<div class="a-mid"><div><h3>' + esc(d.customer) + "</h3><small>" + esc(d.product || "No product") + (d.closed_on ? " · closed " + CM.day(d.closed_on) : "") + "</small></div>" +
      '<dl class="a-facts"><div><dt>Value</dt><dd>' + money(d.amount) + "</dd></div><div><dt>Payment</dt><dd>" + esc(CM.payLabel[d.payment_status] || "") + (d.payment_status === "part_paid" && d.amount_received ? " · " + money(d.amount_received) : "") + "</dd></div><div><dt>Reference</dt><dd>" + esc(d.payment_ref || "None given") + "</dd></div></dl></div>" +
      check + recv + (d.notes ? '<p class="muted" style="margin:10px 0 0">“' + esc(d.notes) + "”</p>" : "") +
      '<div class="a-foot"><div class="grow">' + (canApprove ? CM.cline(p.parts, p.amount, p.label) : '<span class="muted">' + why + "</span>") + "</div>" +
      '<div class="row actions-row"><button class="btn" data-reject="' + esc(d.id) + '"' + (busy ? " disabled" : "") + '>Don’t approve</button><button class="btn dark" data-approve="' + esc(d.id) + '"' + (busy || !canApprove ? " disabled" : "") + (canApprove ? ' data-tour="approve"' : "") + ">" + (busy ? "Approving…" : "Approve " + (canApprove ? money(p.amount) : "")) + "</button></div></div>" +
      (err ? '<p class="note rejected" style="margin:10px 0 0" role="alert">' + esc(err) + "</p>" : "") + reject + "</article>";
  }
  function viewApprovals() {
    var w = waitingDeals(), look = w.filter(function (d) { return d.check_status === "needs_a_look"; });
    var total = sum(w.filter(function (d) { return d.payment_status !== "not_paid"; }), function (d) { return priced(d).amount; });
    var decided = CM.state.deals.filter(function (d) { return d.status !== "waiting" && d.reviewed_at; }).sort(function (a, b) { return String(b.reviewed_at).localeCompare(String(a.reviewed_at)); }).slice(0, 8);
    var decidedHtml = decided.length ? '<div class="section">Decided recently <span>' + decided.length + '</span></div><div class="grid mobile-cards"><table class="t"><thead><tr><th>Deal</th><th>Salesperson</th><th>Decision</th><th class="r">Commission</th></tr></thead><tbody>' + decided.map(function (d) {
      var line = lineFor(d);
      return "<tr><td><b>" + esc(d.customer) + '</b><br><small class="muted">' + CM.day(d.reviewed_at) + " · " + esc(CM.first(d.reviewed_by)) + "</small></td><td>" + esc(d.rep_name) + "</td><td>" + (d.status === "approved" ? '<span class="chip approved">Approved</span>' : '<span class="chip rejected">Not approved</span><div class="muted" style="font-size:12.5px;margin-top:2px">' + esc(d.finance_note || "") + "</div>") + '</td><td class="r">' + (line ? money(line.amount) : "—") + "</td></tr>";
    }).join("") + "</tbody></table>" + decided.map(function (d) {
      var line = lineFor(d);
      return '<div class="mc"><div class="row"><b class="grow">' + esc(d.customer) + "</b>" + (d.status === "approved" ? '<span class="chip approved">Approved</span>' : '<span class="chip rejected">Not approved</span>') + '</div><div class="kv"><span>' + esc(d.rep_name) + " · " + esc(CM.first(d.reviewed_by)) + "</span><span>" + (line ? money(line.amount) : "—") + "</span></div></div>";
    }).join("") + "</div>" : "";
    var tip = '<div class="say">' + CM.tallyFace() + "<div><b>Pro tip: set your own approval rules</b><p>Chat with Lemma to let me approve the easy ones for you, for example:</p><q>“Auto-approve deals under " + money(50000) + " that are paid in full, have a reference and look right.”</q>" +

  /* ═══ actions ═══ */
  function pickMode() {

  async function submitDeal() {
    var m = me(), f = S.form, err = {};
    if (!String(f.customer).trim()) err.customer = "Who bought?";
    if (!(Number(f.amount) > 0)) err.amount = "Enter the deal value, before tax.";
    if (f.payment_status === "part_paid" && !(Number(f.amount_received) > 0)) err.amount_received = "How much has come in so far?";
    if (f.payment_status === "part_paid" && Number(f.amount_received) > Number(f.amount)) err.amount_received = "That’s more than the deal value.";
    if (f.customer_email && !/^\S+@\S+\.\S+$/.test(f.customer_email)) err.customer_email = "That doesn’t look like an email.";
    S.formErr = err;
    if (Object.keys(err).length) { redrawLog(); var first = document.getElementById("f-" + Object.keys(err)[0]); if (first) first.focus(); return; }
    S.logBusy = true; render();
    var data = { customer: f.customer.trim(), product: String(f.product || "").trim() || null, amount: Number(f.amount), closed_on: f.closed_on || null, payment_status: f.payment_status,
      amount_received: f.payment_status === "part_paid" ? Number(f.amount_received) : null, payment_ref: f.payment_ref.trim() || null, customer_email: f.customer_email.trim() || null,
      notes: f.notes.trim() || null, rep_name: m.name, rep_email: m.email, logged_via: "app", status: "waiting" };
    Object.keys(data).forEach(function (k) { if (data[k] === null) delete data[k]; });
    try {
      var rec = await CM.client.records.create("deals", data);
      var id = rec && (rec.id || (rec.data && rec.data.id));
      S.logBusy = false; S.form = null;
      await CM.load();
      CM.toast("Logged " + esc(data.customer) + ". Tally is checking it now.");
      location.hash = id ? "#/deal/" + id : "#/";
    } catch (e) { S.logBusy = false; S.formErr = { customer: "Couldn’t log it: " + CM.errText(e) + ". Your details are still here." }; render(); }
  }
  function editDeal(id) {
    var m = me(), d = CM.state.deals.filter(function (x) { return x.id === id; })[0]; if (!d) return;
    CM.sheet('<h2>Edit ' + esc(d.customer) + '</h2><p class="sub">Finance sees that you changed it.</p><form id="ed" style="margin-top:14px">' +
      '<div class="field"><label for="ed-ps">Payment</label><select class="input" id="ed-ps">' + [["paid_in_full", "Paid in full"], ["part_paid", "Part paid"], ["not_paid", "Not paid yet"]].map(function (p) { return '<option value="' + p[0] + '"' + (d.payment_status === p[0] ? " selected" : "") + ">" + p[1] + "</option>"; }).join("") + "</select></div>" +

      '<div class="field"><label for="ed-amt">Deal value before tax</label><input class="input" id="ed-amt" type="number" inputmode="decimal" value="' + esc(d.amount) + '"></div>' +
      '<div class="actions"><button type="button" class="btn" data-x>Cancel</button><button class="btn dark" type="submit">Save changes</button></div></form>', function (root, close) {

  async function approve(id) {
    var d = CM.state.deals.filter(function (x) { return x.id === id; })[0]; if (!d) return;
    S.busy[id] = true; delete S.err[id]; render();
    try {
      var run = await CM.client.functions.run("approve_deal", { input: { deal_id: id, reviewer_name: CM.myName() } });
      var status = String((run && (run.status || run.state)) || "").toUpperCase();
      if (status === "FAILED" || status === "ERROR" || (run && run.error)) throw new Error(CM.errText({ message: run.error || run.error_message || "It didn’t go through." }));
      var out = (run && (run.output_data || run.output || run.result)) || {};
      await CM.load();
      CM.toast("Approved " + esc(d.customer) + ". " + esc(CM.first(d.rep_name)) + " earns " + money(out.amount != null ? out.amount : priced(d).amount) + ".");
    } catch (e) { S.err[id] = CM.errText(e); }
    delete S.busy[id]; render();
  }
  async function reject(id) {
    var d = CM.state.deals.filter(function (x) { return x.id === id; })[0]; if (!d) return;
    var why = String(S.rejectText[id] || "").trim();
    if (!why) { S.err[id] = "Say why, so " + CM.first(d.rep_name) + " can fix it."; render(); var ta = document.getElementById("why-" + id); if (ta) ta.focus(); return; }
    S.busy[id] = true; delete S.err[id]; render();
    try {
      await CM.client.records.update("deals", id, { status: "rejected", finance_note: why, reviewed_by: CM.myName(), reviewed_by_email: CM.myEmail(), reviewed_at: new Date().toISOString() });
      delete S.rejecting[id]; delete S.rejectText[id]; await CM.load();
      CM.toast("Not approved. " + esc(CM.first(d.rep_name)) + " will hear why.");
